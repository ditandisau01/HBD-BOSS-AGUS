<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun BOSS</title>
<style>
  :root{
    --bg-deep: #1c1233;
    --bg-mid: #2c1b4d;
    --gold: #e8b94a;
    --gold-soft: #f6d98a;
    --cream: #fbf3e7;
    --pink: #e8798f;
    --plate: #3a2359;
    --cake-body: #f3d9c4;
    --frosting: #fbeee0;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 20%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: Georgia, 'Times New Roman', serif;
    overflow-x:hidden;
    color: var(--cream);
  }

  .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars span{
    position:absolute; width:2px; height:2px;
    background: var(--gold-soft); border-radius:50%;
    opacity:.7; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }

  .wrap{
    position:relative; z-index:1;
    max-width: 620px; margin: 0 auto;
    padding: 60px 24px 80px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
    min-height: 100vh; justify-content:center;
  }

  h1{
    font-size: clamp(28px, 6vw, 44px);
    line-height: 1.3; margin: 0 0 14px;
    color: var(--cream); font-weight: 700;
  }
  h1 .name{ color: var(--gold); font-style: italic; }

  .age-line{
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 20px; color: var(--gold-soft);
    margin: 0 0 36px;
  }

  .stage{ position:relative; width: 320px; height: 300px; margin: 0 auto; }

  .plate{
    position:absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 24px; background: var(--plate);
    border-radius: 50%; box-shadow: 0 0 0 2px rgba(232,185,74,.25);
  }

  .cake{
    position:absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    width: 220px;
  }

  .tier{
    position:relative; background: var(--cake-body);
    border: 2px solid #d9b998; border-radius: 6px;
  }
  .tier.bottom{ width: 220px; height: 78px; }
  .tier.top{ width: 150px; height: 62px; margin: 0 auto; }

  .drip{
    position:absolute; top:-14px; left:0; right:0; height: 24px;
    background: var(--frosting);
    border-radius: 6px 6px 40% 40% / 6px 6px 60% 60%;
  }
  .drip::before, .drip::after{
    content:""; position:absolute; top: 10px;
    width: 22px; height: 26px; background: var(--frosting);
    border-radius: 0 0 50% 50%;
  }
  .drip::before{ left: 18px; }
  .drip::after{ right: 30px; }

  .stripe{
    position:absolute; top:0; bottom:0; width: 10px;
    background: rgba(107,66,38,.28);
  }

  .number-candles{
    position:absolute; top:-92px; left:50%; transform: translateX(-50%);
    display:flex; gap: 10px;
  }
  .num-candle{
    position:relative;
    width: 34px; height: 62px;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-weight: 900;
    font-size: 58px;
    line-height: 62px;
    text-align:center;
    color: transparent;
    background: linear-gradient(180deg, var(--pink), #c85a72);
    -webkit-background-clip: text;
    background-clip: text;
    cursor: pointer;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
  }
  .flame{
    position:absolute; top: -22px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 18px;
    background: radial-gradient(circle at 50% 30%, #fff5cc, var(--gold) 55%, #d9720f 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(232,185,74,.9));
  }
  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%{ transform: translateX(-50%) scale(1.12) rotate(3deg); }
  }

  .confetti{
    position: fixed; top: -20px; width: 8px; height: 14px;
    opacity: 0.9; z-index: 2;
    animation-name: fall; animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div id="confettiLayer"></div>

<div class="wrap">
  <h1>Salama' Allo Kadadian<br><span class="name">BOSS</span> 🎉🥳🎂</h1>

  <div class="stage">
    <div class="plate"></div>
    <div class="cake">
      <div class="tier top">
        <div class="drip"></div>
        <div class="stripe" style="left:35px"></div>
        <div class="stripe" style="right:35px;left:auto"></div>
        <div class="number-candles">
          <div class="num-candle">5<div class="flame"></div></div>
          <div class="num-candle">4<div class="flame"></div></div>
        </div>
      </div>
      <div class="tier bottom">
        <div class="drip"></div>
        <div class="stripe" style="left:40px"></div>
        <div class="stripe" style="left:105px"></div>
        <div class="stripe" style="right:40px;left:auto"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsContainer.appendChild(s);
  }

  const confettiColors = ['#e8b94a','#e8798f','#fbf3e7','#8bd3c7','#f6d98a'];
  const confettiLayer = document.getElementById('confettiLayer');
  function spawnConfetti(){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    c.style.animationDuration = (4 + Math.random()*3)+'s';
    c.style.width = (6 + Math.random()*4)+'px';
    c.style.height = (10 + Math.random()*6)+'px';
    confettiLayer.appendChild(c);
    setTimeout(()=> c.remove(), 8000);
  }
  setInterval(spawnConfetti, 300);

  document.querySelectorAll('.num-candle').forEach(candle=>{
    candle.addEventListener('click', ()=>{
      const flame = candle.querySelector('.flame');
      if(flame) flame.style.display = 'none';
    });
  });
</script>

</body>
</html>
